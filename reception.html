<!doctype html>
<html lang="fr" class="recep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réception colis – opérateurs GMP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar"><img src="logo.webp" alt="GMP – IUT de Bordeaux"><h1>Je réceptionne un colis</h1>
  <div class="zoomctl" title="Zoom de l'affichage">
    <button type="button" id="zmin" aria-label="Réduire">−</button>
    <input type="range" id="zoom" min="50" max="110" step="5" value="80" list="zticks" aria-label="Zoom"><datalist id="zticks"><option value="80"></option></datalist>
    <button type="button" id="zplus" aria-label="Agrandir">+</button>
    <button type="button" id="zval" title="Revenir à la position nominale (80 %)">80 %</button>
  </div>
  <a class="back" href="index.html">← Accueil</a></div>
<div class="wrap recep">
  <div class="toolbar">
    <div class="searchrow">
      <input id="q" type="search" placeholder="🔍 Rechercher : nom, fournisseur, contenu, n° de commande…" autocomplete="off" inputmode="search">
      <button class="btn ghost" id="clear">Effacer</button>
      <button class="btn ghost" id="walkinbtn" type="button" title="Un colis est arrivé sans avoir été déclaré">＋ Colis non déclaré</button>
      <button class="btn ghost" id="viewtoggle" type="button" title="Changer l'affichage">☰ Liste</button>
      <button class="btn ghost kbtoggle" id="kbtoggle" type="button">⌨</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="attendu">À réceptionner <span id="cA"></span></button>
      <button class="tab" data-tab="recu">Déjà réceptionnés (7 j) <span id="cR"></span></button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="chips" id="chipsF"></div>
    <div class="chips" id="chipsA"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="selbar" id="selbar" hidden>
  <div><b id="selcount"></b></div>
  <div style="display:flex;gap:10px"><button class="btn ghost" id="selclear">Annuler la sélection</button><button class="btn" id="selgo">Valider la réception →</button></div>
</div>

<div class="lightbox" id="lb" hidden><img id="lbimg" alt="Photo de la réception"><span>Toucher pour fermer</span></div>
<div class="overlay" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script src="config.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script src="clavier.js"></script>
<script>
(function () {
  const { api, esc, lsGet, lsSet, fmtDate, nomComplet, toast } = RC;
  const $ = (id) => document.getElementById(id);
  let items = [], tab = "attendu", fFour = "", fLet = "", q = "";
  let multi = false, longFired = false, lpTimer = null;   // multi : mode sélection multiple (appui long)
  const sel = new Map();           // id -> nb_recus
  let form = null;                 // état de la fenêtre de validation
  let lieux = window.LIEUX || [];   // lieux de dépôt : définis dans l'admin, sinon liste de config.js
  let operateurs = [];             // liste des opérateurs (définie dans l'admin)

  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  async function load() {
    try { items = (await api.list()).items; } catch (e) { toast("Chargement impossible : " + e.message, "err"); }
    render();
  }

  function visibleBase() { return items.filter((r) => r.statut === tab); }
  function matches(r) {
    if (fFour && r.fournisseur !== fFour) return false;
    if (fLet && norm(r.nom).charAt(0).toUpperCase() !== fLet) return false;
    if (q) {
      const hay = norm([r.prenom, r.nom, r.fournisseur, r.contenu, r.reference].join(" "));
      return norm(q).split(/\s+/).every((w) => hay.includes(w));
    }
    return true;
  }

  function render() {
    const base = visibleBase();
    $("cA").textContent = "(" + items.filter((r) => r.statut === "attendu").length + ")";
    $("cR").textContent = "(" + items.filter((r) => r.statut === "recu").length + ")";
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === tab));

    // chips fournisseurs (avec compteurs)
    const cnt = {}; base.forEach((r) => { cnt[r.fournisseur] = (cnt[r.fournisseur] || 0) + 1; });
    const fours = Object.keys(cnt).sort((a, b) => a.localeCompare(b, "fr"));
    if (fFour && !cnt[fFour]) fFour = "";
    $("chipsF").innerHTML = '<span class="lbl">Fournisseur</span>' + (fours.length ? "" : '<span class="note">—</span>') +
      fours.map((f) => `<button class="chip ${f === fFour ? "on" : ""}" data-four="${esc(f)}"><i class="dot" style="background:${RC.fStyle(f).bg}"></i>${esc(f)}<small>${cnt[f]}</small></button>`).join("");

    // alphabet sur l'initiale du nom
    const letters = new Set(base.map((r) => norm(r.nom).charAt(0).toUpperCase()));
    if (fLet && !letters.has(fLet)) fLet = "";
    $("chipsA").innerHTML = '<span class="lbl">Nom commence par</span>' +
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map((l) => `<button class="chip az ${l === fLet ? "on" : ""} ${letters.has(l) ? "" : "dim"}" data-let="${l}">${l}</button>`).join("");

    const list = base.filter(matches);
    $("grid").className = vue === "liste" ? "grid lst" : "grid";
    $("viewtoggle").textContent = vue === "liste" ? "▦ Tuiles" : "☰ Liste";
    $("grid").innerHTML = list.length ? list.map(vue === "liste" ? row : tile).join("") :
      `<div class="empty">${base.length ? "Aucun résultat avec ces filtres." : tab === "attendu" ? "Aucune commande en attente. 🎉" : "Rien de réceptionné récemment."}</div>`;

    // barre de sélection
    const n = [...sel.keys()].filter((id) => items.some((r) => r.id === id && r.statut === "attendu")).length;
    $("selbar").hidden = !multi;
    $("hint").hidden = tab !== "attendu";
    $("hint").textContent = multi ? "Sélection multiple : touchez les commandes à ajouter, puis validez en bas de l'écran." : "Touchez une commande pour la réceptionner · appui long pour en sélectionner plusieurs.";
    $("selcount").textContent = n + " commande" + (n > 1 ? "s" : "") + " sélectionnée" + (n > 1 ? "s" : "");
  }

  // ---------- affichage : tuiles (bloc fournisseur + bloc nom) ou liste en lignes ----------
  let vue = lsGet("rc_vue", "tuiles");
  const stateOf = (r) => { const bad = r.etat === "incomplete" || r.abime; return { bad, txt: (r.etat === "complete" ? "Complète" : "Incomplète") + " · " + r.nb_recus + " colis" + (r.abime ? " · abîmée" : "") }; };
  const photoTag = (r) => RC.photoUrl(r) ? `<img class="thumb" loading="lazy" alt="Photo de la réception" src="${esc(RC.photoUrl(r, true))}" data-full="${esc(RC.photoUrl(r))}">` : "";

  const fhead = (name) => { const st = RC.fStyle(name); return `<div class="t5-head" style="background:${st.bg};color:${st.fg}">${st.logo ? `<img class="flogo" alt="" src="${st.logo}">` : ""}<span>${esc(name)}</span></div>`; };
  const fpill = (name) => { const st = RC.fStyle(name); return `<span class="fpill" style="background:${st.bg};color:${st.fg}">${st.logo ? `<img class="flogo" alt="" src="${st.logo}">` : ""}${esc(name)}</span>`; };

  const isLate = (r) => r.statut === "attendu" && !!r.date_prevue && r.date_prevue < RC.todayStr();
  const daysLate = (r) => Math.max(1, Math.round((new Date(RC.todayStr() + "T00:00:00") - new Date(r.date_prevue + "T00:00:00")) / 86400000));
  const isToday = (r) => !!r.date_prevue && r.date_prevue === RC.todayStr();
  const prevTxt = (r) => !r.date_prevue ? "" : isLate(r) ? "<span class=\"prev late\">en retard de " + daysLate(r) + " j (prévue le " + RC.fmtDay(r.date_prevue) + ")</span>" : isToday(r) ? "<span class=\"prev now\">attendue aujourd'hui</span>" : "<span class=\"prev\">prévue le " + RC.fmtDay(r.date_prevue) + "</span>";

  function tile(r) {
    if (r.statut === "recu") {
      const st = stateOf(r);
      return `<div class="tile t5 done">${fhead(r.fournisseur)}
        <div class="t5-body"><div class="who">${esc(nomComplet(r))}</div>
        ${r.contenu ? `<div class="what">${esc(r.contenu)}</div>` : ""}
        <div class="state ${st.bad ? "warn" : "ok"}">${st.bad ? "⚠️" : "✅"} ${st.txt}</div>
        <div class="meta">${r.non_declare ? "<b class=\"nd\">non déclaré</b>" : ""}<span>📍 ${esc(r.lieu)}</span><span>${fmtDate(r.recu_le)}${r.operateur ? " · " + (RC.emojiOf(r.operateur) ? RC.emojiOf(r.operateur) + " " : "") + esc(r.operateur) : ""}</span></div>
        ${photoTag(r)}</div></div>`;
    }
    const on = sel.has(r.id);
    return `<button class="tile t5 ${on ? "sel" : ""} ${isToday(r) ? "today" : ""} ${isLate(r) ? "late" : ""}" data-id="${esc(r.id)}">${multi ? `<span class="check">${on ? "✓" : ""}</span>` : ""}
      ${fhead(r.fournisseur)}
      <div class="t5-body"><div class="who">${esc(nomComplet(r))}</div>
      ${r.contenu ? `<div class="what">${esc(r.contenu)}</div>` : ""}
      <div class="meta">${r.reference ? `<span>N° ${esc(r.reference)}</span>` : ""}<span>${r.non_declare ? "<b class=\"nd\">non déclaré</b>" : "déclarée le " + fmtDate(r.created)}</span>${prevTxt(r)}</div></div></button>`;
  }

  function row(r) {
    if (r.statut === "recu") {
      const st = stateOf(r);
      return `<div class="lrow done"><span class="lf">${fpill(r.fournisseur)}</span><span class="ln">${esc(nomComplet(r))}</span><span class="lc">${esc(r.contenu)}</span>
        <span class="state ${st.bad ? "warn" : "ok"}">${st.bad ? "⚠️" : "✅"} ${st.txt}</span><span class="lm">📍 ${esc(r.lieu)}<br>${fmtDate(r.recu_le)}</span>${photoTag(r) || "<span></span>"}</div>`;
    }
    const on = sel.has(r.id);
    return `<button class="lrow ${on ? "sel" : ""} ${isToday(r) ? "today" : ""} ${isLate(r) ? "late" : ""}" data-id="${esc(r.id)}"><span class="lf">${fpill(r.fournisseur)}</span><span class="ln">${esc(nomComplet(r))}</span><span class="lc">${esc(r.contenu)}${r.reference ? ` <small>(N° ${esc(r.reference)})</small>` : ""}</span>
      <span class="lm">${fmtDate(r.created)}${prevTxt(r) ? "<br>" + prevTxt(r) : ""}</span>${multi ? `<span class="check">${on ? "✓" : ""}</span>` : "<span></span>"}</button>`;
  }

  // ---------- événements de la liste ----------
  // photo d'une réception : touchée, elle s'affiche en grand
  $("grid").addEventListener("click", (e) => {
    const im = e.target.closest("img.thumb"); if (!im) return;
    $("lbimg").src = im.dataset.full; $("lb").hidden = false;
  });
  $("lb").onclick = () => { $("lb").hidden = true; $("lbimg").removeAttribute("src"); };
  // appui long (0,55 s) sur une commande attendue : passe en sélection multiple (des cases à cocher apparaissent)
  const lpCancel = () => { clearTimeout(lpTimer); lpTimer = null; };
  $("grid").addEventListener("pointerdown", (e) => {
    if (multi || tab !== "attendu") return;
    const t = e.target.closest("[data-id]"); if (!t) return;
    lpCancel(); const id = t.dataset.id;
    lpTimer = setTimeout(() => {
      lpTimer = null; longFired = true; multi = true; sel.clear(); sel.set(id, 1); render();
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (err) { /* sans vibration */ }
    }, 550);
  });
  $("grid").addEventListener("pointermove", (e) => { if (lpTimer && (Math.abs(e.movementX) > 6 || Math.abs(e.movementY) > 6)) lpCancel(); });   // le doigt fait défiler : pas un appui long
  ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, () => { lpCancel(); setTimeout(() => { longFired = false; }, 350); }));
  $("grid").addEventListener("contextmenu", (e) => e.preventDefault());
  $("grid").onclick = (e) => {
    if (longFired) { longFired = false; return; }       // le clic qui suit un appui long est ignoré
    const t = e.target.closest("[data-id]"); if (!t) return;
    const id = t.dataset.id;
    if (multi) {                                         // sélection multiple : on coche / décoche
      if (sel.has(id)) sel.delete(id); else sel.set(id, 1);
      if (!sel.size) multi = false;
      render(); return;
    }
    sel.clear(); sel.set(id, 1);                          // appui simple : on passe directement à la réception
    openForm();
    if (form) form.single = true;
  };
  $("chipsF").onclick = (e) => { const b = e.target.closest("[data-four]"); if (b) { fFour = fFour === b.dataset.four ? "" : b.dataset.four; render(); } };
  $("chipsA").onclick = (e) => { const b = e.target.closest("[data-let]"); if (b) { fLet = fLet === b.dataset.let ? "" : b.dataset.let; render(); } };
  document.querySelector(".tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; multi = false; sel.clear(); render(); } };
  $("q").oninput = () => { q = $("q").value; render(); };
  $("clear").onclick = () => { q = ""; fFour = ""; fLet = ""; $("q").value = ""; render(); };
  $("viewtoggle").onclick = () => { vue = vue === "liste" ? "tuiles" : "liste"; lsSet("rc_vue", vue); render(); };
  $("selclear").onclick = () => { sel.clear(); multi = false; render(); };
  $("selgo").onclick = openForm;

  // ---------- fenêtre de validation ----------
  function openForm() {
    const picked = items.filter((r) => sel.has(r.id) && r.statut === "attendu");
    if (!picked.length) return;
    const memo = lsGet("rc_operateur", "");
    form = { picked, etat: "complete", abime: false, lieu: "", commentaire: "", operateur: memo, err: "" };
    drawForm();
    $("ov").hidden = false;
  }
  function drawForm() {
    const f = form;
    const txt = operateurs.includes(f.operateur) ? "" : f.operateur;      // nom saisi à la main (hors liste)
    $("sheet").className = "sheet full";
    $("sheet").innerHTML = `
      <div class="shead"><h2>Valider la réception</h2><span class="note">${f.picked.length} commande${f.picked.length > 1 ? "s" : ""}</span></div>
      <div class="sbody">
        <div class="scol">
          <h3 style="margin-top:0">Combien de colis reçus ? <span class="note" style="text-transform:none">(par commande)</span></h3>
          <div class="reclist">${f.picked.map((r) => `
            <div class="recrow"><div class="t"><b>${esc(nomComplet(r))}</b><small>${esc(r.fournisseur)}${r.contenu ? " — " + esc(r.contenu) : ""}</small></div>
            <div class="stepper"><button data-dec="${esc(r.id)}">−</button><span>${sel.get(r.id)} colis</span><button data-inc="${esc(r.id)}">+</button></div></div>`).join("")}
          </div>
          <h3>Commentaire <span class="note" style="text-transform:none">(facultatif)</span></h3>
          <textarea id="com" rows="3" placeholder="Ex. boîte écrasée, il manque la notice…">${esc(f.commentaire)}</textarea>
        </div>
        <div class="scol">
          <h3 style="margin-top:0">La commande est…</h3>
          <div class="choices">
            <button class="choice good ${f.etat === "complete" ? "on" : ""}" data-etat="complete">✅ Complète</button>
            <button class="choice bad ${f.etat === "incomplete" ? "on" : ""}" data-etat="incomplete">⚠️ Incomplète</button>
          </div>
          <h3>État du colis</h3>
          <div class="choices">
            <button class="choice good ${!f.abime ? "on" : ""}" data-abime="0">👍 Intact</button>
            <button class="choice bad ${f.abime ? "on" : ""}" data-abime="1">💥 Abîmé</button>
          </div>
          <h3>Mis à disposition à…</h3>
          <div class="choices">${lieux.map((l) => `<button class="choice ${f.lieu === l ? "on" : ""}" data-lieu="${esc(l)}">📍 ${esc(l)}</button>`).join("")}</div>
          <h3>Opérateur <span class="note" style="text-transform:none">(facultatif)</span></h3>
          ${operateurs.length ? `<div class="choices" id="opbtns">${operateurs.map((o) => `<button class="choice ${f.operateur === o ? "on" : ""}" data-op="${esc(o)}">${RC.emojiOf(o) || "👤"} ${esc(o)}</button>`).join("")}</div>` : ""}
          <input type="text" id="op" placeholder="${operateurs.length ? "Autre nom (saisie libre)" : "Nom de l'opérateur"}" value="${esc(txt)}" style="margin-top:10px">
        </div>
      </div>
      <div class="sfoot">
        ${f.err ? `<div class="err" style="margin:0 0 8px">${esc(f.err)}</div>` : ""}
        <div class="actions" style="margin:0"><button class="btn ghost" id="fcancel">Annuler</button><button class="btn" id="fsend">📧 Valider et prévenir</button></div>
      </div>`;
  }
  // texte tapé à la main = nom de l'opérateur (prioritaire sur un bouton) ; champ vidé = pas d'opérateur saisi
  function keepText() {
    if ($("com")) form.commentaire = $("com").value;
    if ($("op")) { const t = $("op").value.trim(); if (t) form.operateur = t; else if (!operateurs.includes(form.operateur)) form.operateur = ""; }
  }
  function paintOps() { document.querySelectorAll("#opbtns [data-op]").forEach((b) => b.classList.toggle("on", b.dataset.op === form.operateur)); }
  $("sheet").addEventListener("input", (e) => { if (form && e.target.id === "op") { keepText(); paintOps(); } });

  $("sheet").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b || !form) return;
    if (form.walkin) { await walkClick(b); return; }
    keepText();
    const d = b.dataset;
    if (d.etat) form.etat = d.etat;
    else if (d.abime != null && d.abime !== "") form.abime = d.abime === "1";
    else if (d.lieu) form.lieu = d.lieu;
    else if (d.op !== undefined) form.operateur = form.operateur === d.op ? "" : d.op;
    else if (d.inc || d.dec) {
      const r = items.find((x) => x.id === (d.inc || d.dec));
      sel.set(r.id, Math.max(1, Math.min(99, sel.get(r.id) + (d.inc ? 1 : -1))));
    }
    else if (b.id === "fcancel" || b.id === "fclose") {
      if (form.single) sel.clear();   // réception ouverte d'un appui simple : rien n'reste sélectionné
      if (form.walkinId) {   // saisie d'un colis non déclaré abandonnée : on retire la fiche créée
        try { await api.walkinDiscard({ id: form.walkinId }); } catch (err) { /* sans importance */ }
        items = items.filter((r) => r.id !== form.walkinId); sel.delete(form.walkinId);
      }
      $("ov").hidden = true; form = null; clearInterval(pollTimer); await load(); return;
    }
    else if (b.id === "fnophoto") {
      b.disabled = true;
      try { await api.sendNow(form.lot); toast("Mails envoyés sans photo.", "ok"); } catch (err) { toast(err.message, "err"); b.disabled = false; }
      return;
    }
    else if (b.id === "fsend") { await send(); return; }
    drawForm();
  };

  async function send() {
    if (!form.lieu) { form.err = "Choisissez le lieu de mise à disposition."; drawForm(); return; }
    lsSet("rc_operateur", form.operateur.trim());
    const btn = $("fsend"); btn.disabled = true; btn.textContent = "Envoi…";
    try {
      const res = await api.receive({
        items: form.picked.map((r) => ({ id: r.id, nb_recus: sel.get(r.id) })),
        etat: form.etat, abime: form.abime, lieu: form.lieu, commentaire: form.commentaire.trim(), operateur: form.operateur.trim(),
      });
      const ko = res.results.filter((r) => r.error);
      form.picked.forEach((r) => sel.delete(r.id));
      multi = false;
      if (ko.length) toast(ko.length + " commande(s) non traitée(s) : " + ko[0].error, "err");
      await load();
      if (res.lot) step2(res.lot); else { $("ov").hidden = true; form = null; }
    } catch (e) { form.err = e.message; drawForm(); }
  }

  // ---------- étape 2 : photo par QR code ----------
  let pollTimer = null;
  function step2(lot) {
    const photoUrl = new URL("photo.html?lot=" + encodeURIComponent(lot), location.href).href;
    form = { step2: true, lot };
    let qrHtml = "";
    try { const qr = qrcode(0, "M"); qr.addData(photoUrl); qr.make(); qrHtml = qr.createImgTag(6, 8); } catch (e) { qrHtml = '<p class="err">QR code indisponible</p>'; }
    $("sheet").className = "sheet full";
    $("sheet").innerHTML = `<div class="shead"><h2>✅ Réception enregistrée</h2></div>
      <div class="sbody">
        <div class="scol" style="text-align:center">
          <p style="margin-top:0">Pour <b>joindre une photo</b> au mail, scannez ce QR code avec un téléphone :</p>
          <div class="qrbox">${qrHtml}</div>
          ${RC.demo ? `<p class="note">Mode démo : <a href="${esc(photoUrl)}" target="_blank">ouvrir la page photo dans ce navigateur</a></p>` : ""}
        </div>
        <div class="scol">
          <div id="lotstate" class="lotstate">⏳ En attente de la photo…</div>
          <div id="lotmails"></div>
          <p class="note">Sans photo, le mail part tout seul au bout de 10 minutes.</p>
        </div>
      </div>
      <div class="sfoot"><div class="actions" style="margin:0"><button class="btn ghost" id="fnophoto">Envoyer sans photo</button><button class="btn" id="fclose">Terminer</button></div></div>`;
    $("ov").hidden = false;
    clearInterval(pollTimer);
    const poll = async () => {
      if (!form || form.lot !== lot || $("ov").hidden) { clearInterval(pollTimer); return; }
      try {
        const st = await api.lot(lot);
        if (st.sent) {
          clearInterval(pollTimer);
          $("lotstate").className = "lotstate ok";
          $("lotstate").textContent = st.erreur ? "⚠️ Réception enregistrée, mais le mail n'a pas pu partir (réglage SMTP ?)." : (st.photo ? "✅ Photo reçue, mails envoyés avec la photo." : "✅ Mails envoyés (sans photo).");
          if ($("fnophoto")) $("fnophoto").hidden = true;
          if (RC.demo && st.demoMails) $("lotmails").innerHTML = '<p class="note">Mode démo — voici ce qui serait parti :</p>' + st.demoMails.map((m) => `<div class="mailprev">${esc(m)}</div>`).join("");
        }
      } catch (e) { /* nouvelle tentative au prochain tour */ }
    };
    pollTimer = setInterval(poll, 2500);
  }

  // ---------- colis arrivé sans déclaration : l'opérateur choisit le destinataire parmi les personnes connues ----------
  let people = [], fournisseursCfg = [], wk = null;
  const wkBtn = (p) => `<button class="choice ${wk.personId === p.id ? "on" : ""}" data-pid="${esc(p.id)}">${esc((p.nom || "").toUpperCase() + " " + (p.prenom || ""))}</button>`;
  function wkPeopleHtml() {
    const q = norm(wk.q);
    const list = people.filter((p) => !q || norm(p.nom + " " + p.prenom).includes(q) || norm(p.prenom + " " + p.nom).includes(q)).slice(0, 60);
    return list.length ? list.map(wkBtn).join("") : '<span class="note">Personne trouvée. Saisissez le nom plus bas.</span>';
  }
  function drawWalkin() {
    $("sheet").className = "sheet full";
    $("sheet").innerHTML = `
      <div class="shead"><h2>Colis non déclaré</h2><span class="note">Pour qui est ce colis ?</span></div>
      <div class="sbody">
        <div class="scol">
          <h3 style="margin-top:0">Destinataire</h3>
          <input type="text" id="wq" placeholder="Chercher un nom…" value="${esc(wk.q)}" autocomplete="off">
          <div class="choices plist" id="wlist" style="margin-top:10px">${wkPeopleHtml()}</div>
          <h3>Personne absente de la liste ? <span class="note" style="text-transform:none">(aucun mail ne sera envoyé)</span></h3>
          <input type="text" id="wname" placeholder="Nom et prénom" value="${esc(wk.name)}" autocomplete="off">
        </div>
        <div class="scol">
          <h3 style="margin-top:0">Fournisseur <span class="note" style="text-transform:none">(facultatif)</span></h3>
          <div class="choices">${fournisseursCfg.map((f) => { const st = RC.fStyle(f); return `<button class="choice ${wk.four === f ? "on" : ""}" data-wf="${esc(f)}" style="${wk.four === f ? "" : "border-left:10px solid " + st.bg}">${esc(f)}</button>`; }).join("")}</div>
          <input type="text" id="wfour" placeholder="Autre fournisseur" value="${fournisseursCfg.includes(wk.four) ? "" : esc(wk.four)}" style="margin-top:10px" autocomplete="off">
          <h3>Contenu <span class="note" style="text-transform:none">(facultatif)</span></h3>
          <input type="text" id="wcont" placeholder="Ex. carton, enveloppe…" value="${esc(wk.cont)}" autocomplete="off">
        </div>
      </div>
      <div class="sfoot">
        ${wk.err ? `<div class="err" style="margin:0 0 8px">${esc(wk.err)}</div>` : ""}
        <div class="actions" style="margin:0"><button class="btn ghost" id="wcancel">Annuler</button><button class="btn" id="wgo">Continuer →</button></div>
      </div>`;
  }
  async function openWalkin() {
    wk = { q: "", name: "", personId: "", four: "", cont: "", err: "" };
    form = { walkin: true };
    try { people = (await api.people()).items; } catch (e) { people = []; }
    drawWalkin();
    $("ov").hidden = false;
  }
  function wkSyncText() {
    if ($("wq")) wk.q = $("wq").value;
    if ($("wname")) wk.name = $("wname").value;
    if ($("wcont")) wk.cont = $("wcont").value;
    if ($("wfour") && $("wfour").value.trim()) wk.four = $("wfour").value.trim();
  }
  function walkInput(e) {
    if (e.target.id === "wq") { wk.q = e.target.value; $("wlist").innerHTML = wkPeopleHtml(); }
    else if (e.target.id === "wname") { wk.name = e.target.value; if (wk.name.trim()) { wk.personId = ""; $("wlist").innerHTML = wkPeopleHtml(); } }
    else if (e.target.id === "wfour") { wk.four = e.target.value.trim(); document.querySelectorAll("#sheet [data-wf]").forEach((b) => b.classList.remove("on")); }
    else if (e.target.id === "wcont") wk.cont = e.target.value;
  }
  async function walkClick(b) {
    wkSyncText();
    const d = b.dataset;
    if (d.pid) { wk.personId = wk.personId === d.pid ? "" : d.pid; if (wk.personId) wk.name = ""; drawWalkin(); return; }
    if (d.wf) { wk.four = wk.four === d.wf ? "" : d.wf; drawWalkin(); return; }
    if (b.id === "wcancel") { $("ov").hidden = true; form = null; wk = null; return; }
    if (b.id === "wgo") {
      if (!wk.personId && !wk.name.trim()) { wk.err = "Choisissez le destinataire dans la liste, ou saisissez son nom."; drawWalkin(); return; }
      b.disabled = true;
      try {
        const res = await api.walkin({ person_id: wk.personId, nom: wk.name.trim(), fournisseur: wk.four, contenu: wk.cont.trim() });
        items.push(res.item); sel.clear(); sel.set(res.item.id, 1);
        render();
        openForm();                       // la validation se fait comme pour n'importe quelle réception
        if (form) form.walkinId = res.item.id;
      } catch (e) { wk.err = e.message; drawWalkin(); }
    }
  }
  $("walkinbtn").onclick = openWalkin;
  $("sheet").addEventListener("input", (e) => { if (form && form.walkin) walkInput(e); });

  api.config().then((c) => { fournisseursCfg = c.fournisseurs || []; operateurs = c.operateurs || []; if (c.lieux && c.lieux.length) lieux = c.lieux; RC.setStyles(c.styles, c.fournisseurs); RC.setEmojis(c.emojis); render(); }).catch(() => {});
  Clavier.init({ toggle: $("kbtoggle") });

  // ---------- zoom de tout ce qui est sous la barre du haut (mémorisé) ----------
  const ZNOM = 80, ZMIN = ZNOM - 30, ZMAX = ZNOM + 30;   // position nominale 80 %, réglage de ± 30 points
  function setZoom(v) {
    v = Math.max(ZMIN, Math.min(ZMAX, Math.round(v / 5) * 5));
    document.documentElement.style.setProperty("--z", v / 100);
    $("zoom").value = v; $("zval").textContent = v + " %";
    lsSet("rc_zoom2", v);
    setTopH();
  }
  // hauteur de la barre du haut (la barre de recherche collante se place juste dessous)
  function setTopH() { document.documentElement.style.setProperty("--tb", document.querySelector(".topbar").offsetHeight + "px"); }
  $("zoom").oninput = () => setZoom(+$("zoom").value);
  $("zmin").onclick = () => setZoom(+$("zoom").value - 10);
  $("zplus").onclick = () => setZoom(+$("zoom").value + 10);
  $("zval").onclick = () => setZoom(ZNOM);
  window.addEventListener("resize", setTopH);
  setZoom(+lsGet("rc_zoom2", ZNOM) || ZNOM);
  load();
  setInterval(() => { if (!form && $("ov").hidden) load(); }, 30000);   // rafraîchit si une nouvelle commande est déclarée
})();
</script>
</body>
</html>
